<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocali Widget Demo</title>

    <style>
      :root {
        --primary-gradient: linear-gradient(135deg, #7266ff, #5143ff);
        --bg-color: #f8fafc;
        --card-bg: rgba(255, 255, 255, 0.7);
        --text-main: #0f172a;
        --text-muted: #64748b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 40px 20px;
        min-height: 100vh;
        background-color: var(--bg-color);
        background-image: 
          radial-gradient(circle at 15% 50%, rgba(114, 102, 255, 0.08), transparent 25%),
          radial-gradient(circle at 85% 30%, rgba(114, 102, 255, 0.08), transparent 25%);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .container {
        width: 100%;
        max-width: 760px;
        background: var(--card-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        padding: 48px;
        border-radius: 32px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 1);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      h1 {
        margin-top: 0;
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
      }

      .subtitle {
        color: var(--text-muted);
        font-size: 1.1rem;
        margin-bottom: 40px;
        line-height: 1.5;
      }

      h2 {
        font-size: 1.25rem;
        font-weight: 700;
        margin-top: 0;
        margin-bottom: 16px;
      }

      .code-container {
        background: #0f172a;
        border-radius: 16px;
        padding: 24px;
        box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        margin-bottom: 40px;
        border: 1px solid rgba(255,255,255,0.1);
      }

      pre {
        margin: 0;
        color: #e2e8f0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.9rem;
        line-height: 1.6;
        overflow-x: auto;
      }

      .config-form {
        background: rgba(255,255,255,0.5);
        padding: 32px;
        border-radius: 24px;
        border: 1px solid rgba(0,0,0,0.05);
        margin-bottom: 40px;
      }

      .config-form h3 {
        margin-top: 0;
        font-size: 1.1rem;
        margin-bottom: 24px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group:last-child {
        margin-bottom: 0;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--text-main);
      }

      input,
      select {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid rgba(0,0,0,0.1);
        border-radius: 12px;
        font-size: 1rem;
        background: white;
        color: var(--text-main);
        transition: all 0.2s;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      }

      input:focus, select:focus {
        outline: none;
        border-color: #7266ff;
        box-shadow: 0 0 0 3px rgba(114, 102, 255, 0.2);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 12px;
        background: var(--primary-gradient);
        color: white;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 600;
        box-shadow: 0 4px 12px rgba(114, 102, 255, 0.3);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(114, 102, 255, 0.4);
      }
      
      button:active {
        transform: translateY(0);
      }
      
      .org-highlight {
        color: #7266ff;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Vocali Demo</h1>
      <p class="subtitle">
        Test your gorgeous new AI widget. Configure the settings below and interact with the launcher on the bottom right.
      </p>

      <h2>Integration Snippet</h2>
      <div class="code-container">
        <pre><code>&lt;script src="https://your-domain.com/widget.iife.js"
        data-organization-id="<span id="example-org-id" class="org-highlight">org_31QtvqJKwhtvop04esLJMkmFouB</span>"&gt;
&lt;/script&gt;</code></pre>
      </div>

      <div class="config-form">
        <h3>Live Configuration</h3>
        <div class="form-group">
          <label for="orgId">Organization ID</label>
          <input
            type="text"
            id="orgId"
            placeholder="Enter your organization ID"
            value=""
          />
        </div>
        <div class="form-group">
          <label for="position">Widget Position</label>
          <select id="position">
            <option value="bottom-right">Bottom Right</option>
            <option value="bottom-left">Bottom Left</option>
          </select>
        </div>
      </div>

      <div class="controls">
        <button onclick="initWidget()">Initialize Widget</button>
        <button onclick="showWidget()">Open Widget</button>
        <button onclick="hideWidget()">Close Widget</button>
        <button onclick="destroyWidget()" style="background: #ef4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);">Destroy</button>
      </div>
    </div>

    <!-- Load the widget with default config -->
    <script
      type="module"
      src="/embed.ts"
      data-organization-id="org_3C4LRt2Wpdczq8Mk2cKHdsZCkYa"
    ></script>

    <script type="module">
      import { EMBED_CONFIG } from "./config.ts";

      // Set display values on load
      document.getElementById("example-org-id").textContent =
        EMBED_CONFIG.DEFAULT_ORG_ID;
      document.getElementById("orgId").value = EMBED_CONFIG.DEFAULT_ORG_ID;

      window.initWidget = function () {
        const config = {
          organizationId:
            document.getElementById("orgId").value ||
            EMBED_CONFIG.DEFAULT_ORG_ID,
          position: document.getElementById("position").value,
        };

        if (window.VocaliWidget) {
          window.VocaliWidget.init(config);
          console.log("Widget reinitialized with config:", config);
        }
      };

      window.showWidget = function () {
        if (window.VocaliWidget) {
          window.VocaliWidget.show();
        } else {
          alert("Please initialize the widget first");
        }
      };

      window.hideWidget = function () {
        if (window.VocaliWidget) {
          window.VocaliWidget.hide();
        }
      };

      window.destroyWidget = function () {
        if (window.VocaliWidget) {
          window.VocaliWidget.destroy();
          console.log("Widget destroyed");
        }
      };
    </script>
  </body>
</html>
